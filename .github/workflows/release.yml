name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:prepare
      - run: pnpm build
      - run: pnpm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            command: pnpm dist:win
          - id: macos-arm64
            os: macos-14
            command: pnpm dist:mac
          - id: linux-x64
            os: ubuntu-latest
            command: pnpm dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:prepare
      - run: pnpm build
      - run: pnpm test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes imagemagick
      - run: ${{ matrix.command }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/sign-windows-artifacts.ps1 -ArtifactDirectory dist -CertificateOutput dist/Astraluster.cer
      - run: node scripts/collect-release-assets.mjs dist release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/**/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
