appId: ai.deepseek.desktop
productName: DeepSeek Desktop
directories:
  output: dist
  buildResources: resources/generated-icons
files:
  - apps/desktop-main/dist/**
  - apps/desktop-renderer/dist/**
  - packages/**/dist/**
  - package.json
extraResources:
  - from: resources/node
    to: node
  - from: resources/host
    to: host
  - from: resources/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: resources/build-identity.json
    to: build-identity.json
asar: true
win:
  icon: resources/icons/DeepSeek_AppleStyle.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: DeepSeek-Desktop-Portable-${version}.${ext}
mac:
  icon: resources/generated-icons/icon.icns
  target:
    - dmg
    - zip
  artifactName: DeepSeek-Desktop-${version}-mac-${arch}.${ext}
linux:
  icon: resources/generated-icons/linux
  target:
    - AppImage
  artifactName: DeepSeek-Desktop-${version}-linux-${arch}.${ext}
